name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"  # كيعاود يخدم كل 6 سوايع

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # هاد السطر كيعطي وقت محدد للـ Job كامل باش يطفى بزز
    timeout-minutes: 350 

    permissions:
      id-token: write
      contents: read
      actions: write

    steps:
      # 1. أول حاجة كنلغيو أي تشغيل قديم باش ما يوقعش تضارب فالحساب
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

      # 2. كننسخوا الملفات من السيرفر
      - name: Clone repository
        uses: actions/checkout@v4

      # 3. تثبيت Node.js نسخة 20
      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. تثبيت أداة Bun (هادي هي اللي غتحل مشكل sh: 1: bun: not found)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 5. الكاش ديال الكود باش يخدم السكربت أسرع المرة الجاية
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 6. تثبيت المكتبات (دابا غادي يدوز بنجاح لأن bun و node موجودين)
      - name: Install Dependencies
        run: npm install

      # 7. تشغيل مشروع البوت
      - name: Start Project
        # هنا كنقولو ليه طفي هاد المرحلة بزز قبل ما يوصل السقف ديال GitHub
        timeout-minutes: 345 
        run: npm run start
